# =============================================================================
#  artillery-ws-storm.yaml — Orbit WebSocket Broadcast Storm & Coalescing Stress
#  Artillery v2 | Engine: socketio | Targets 1,000 Concurrent Connections
# =============================================================================
#
#  VERIFICATION OBJECTIVES:
#    1. Ramp up to 1,000 concurrent WebSocket connections to Orbit's clustered backend.
#    2. Subscribe all 1,000 sockets to the deeply nested benchmark thread: thread:{postId}.
#    3. Capture real-time fan-out latency when the 250ms coalesced Redis broadcast fires.
#    4. Mathematically prove: 0 dropped connections, 0 socket errors (EMFILE/EADDRNOTAVAIL).
#
#  USAGE:
#    $env:AUTH_TOKEN    = node scripts/generate-bench-token.js --token-only
#    $env:BENCH_POST_ID = "<24-char-hex-ObjectId-from-seeder>"
#    artillery run tests/artillery-ws-storm.yaml
# =============================================================================

config:
  target: "http://localhost:5001"

  engines:
    socketio: {}

  socketio:
    auth:
      token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2YTBlYmZjNDFmM2RiMTJiZWIxNGE1OWYiLCJzZXNzaW9uSWQiOiI2YWU3NDg0NzcwZDg2MGRmYmFhMWE3ODUiLCJpYXQiOjE3OTM1NDIyMTUsImV4cCI6MTc5NDE0NzAxNX0.DQETuoXGDnjXH5f8QfcRDgBLBOZwbskGnuEb8-OWoqQ"
    transports:
      - websocket
    path: /socket.io

  phases:
    # Phase 1: Controlled Ramp to 1,000 concurrent connections over 40 seconds
    - name: "Ramp Phase — 25 sockets/sec to 1,000"
      duration: 40
      arrivalRate: 25

    # Phase 2: Steady-state hold — 1,000 sockets open receiving coalesced fan-out
    - name: "Broadcast Storm Hold — 1,000 concurrent sockets receiving feed:metrics_sync"
      pause: 60

  ensure:
    thresholds:
      - "vusers.failed": 0
      - "socketio.emit": { min: 4000 }

scenarios:
  - name: "WebSocket Fan-Out Storm — Deep Thread Subscription & Coalesced Sync"
    engine: socketio
    flow:
      # Step 1: Join global feed room
      - emit:
          channel: "feed:join_feed"
          data: {}

      # Step 2: Join the deeply nested thread room
      - emit:
          channel: "feed:join_thread"
          data:
            postId: "6ae73f0740be00d25ceb676e"

      # Step 3: Hold connection open for 60s while simulated votes or k6 load tests fire
      - think: 60

      # Step 4: Graceful leave and teardown
      - emit:
          channel: "feed:leave_thread"
          data:
            postId: "{{ $processEnvironment.BENCH_POST_ID }}"

      - emit:
          channel: "feed:leave_feed"
          data: {}
